<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptLibrary Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="header-inner">
        <h1>Prompt Library</h1>
        <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
            <svg class="icon" viewBox="0 0 32 32" aria-hidden="true" fill="none">
              <path stroke="currentColor" stroke-linejoin="round" stroke-width="1" d="M19.19 3.757A1 1 0 0018.22 3h-4.44a1 1 0 00-.97.757l-.66 2.644a1 1 0 01-.47.623l-1.291.747a1 1 0 01-.776.095l-2.62-.75a1 1 0 00-1.142.462l-2.219 3.844a1 1 0 00.171 1.219l1.96 1.895a1 1 0 01.305.719v1.49a1 1 0 01-.305.72l-1.96 1.894a1 1 0 00-.17 1.22l2.218 3.843a1 1 0 001.141.461l2.61-.746a1 1 0 01.793.106l.963.584a1 1 0 01.43.54l.984 2.95a1 1 0 00.949.683h4.558a1 1 0 00.949-.684l.982-2.947a1 1 0 01.435-.542l.982-.587a1 1 0 01.79-.103l2.59.745a1 1 0 001.142-.461l2.222-3.848a1 1 0 00-.166-1.214l-1.933-1.896a1 1 0 01-.3-.713v-1.5a1 1 0 01.3-.713l1.933-1.896a1 1 0 00.166-1.214l-2.222-3.848a1 1 0 00-1.142-.46l-2.6.747a1 1 0 01-.774-.093l-1.31-.75a1 1 0 01-.474-.625l-.66-2.64z"/>
              <circle cx="16" cy="16" r="5" stroke="currentColor" stroke-linejoin="round" stroke-width="2"/>
            </svg>
        </button>
      </div>
    </header>
    
    <div class="groups-container" id="groups-container">
      <!-- Контейнер для групп промтов. Элементы добавляются динамически в script.js -->
    </div>
    
    <div class="actions">
      <button id="add-group-btn" class="btn btn-primary">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 25V7M7 16h18"/>
          </svg>
        Add group
      </button>
    </div>
    
    <!-- Скрытый input для импорта (используется из меню настроек) -->
    <input id="import-file" type="file" accept="application/json" style="display:none" />
  </div>
  
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  
  <script src="script.js" type="module"></script>
</body>
</html>
