<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptLibrary Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="header-inner">
        <h1>Prompt Library</h1>
        <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <path d="M12 8a4 4 0 100 8 4 4 0 000-8z" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06A2 2 0 016.04 3.3l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51h.08a1.65 1.65 0 001.82-.33l.06-.06A2 2 0 0121.7 6.04l-.06.06a1.65 1.65 0 00-.33 1.82V8c0 .67.39 1.28 1 1.51H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
      </div>
    </header>
    
    <div class="groups-container" id="groups-container">
      <!-- Контейнер для групп промтов. Элементы добавляются динамически в script.js -->
    </div>
    
    <div class="actions">
      <button id="add-group-btn" class="btn btn-primary">
        <!-- Иконка добавления группы (плюс). Как изменить: заменить <path> или весь <svg>,
             можно также использовать <img src="../../icons/...">. Цвет берётся из currentColor. -->
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 25V7M7 16h18"/>
          </svg>
        Add group
      </button>
    </div>
    
    <!-- Скрытый input для импорта (используется из меню настроек) -->
    <input id="import-file" type="file" accept="application/json" style="display:none" />
  </div>
  
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  
  <script src="script.js" type="module"></script>
</body>
</html>
